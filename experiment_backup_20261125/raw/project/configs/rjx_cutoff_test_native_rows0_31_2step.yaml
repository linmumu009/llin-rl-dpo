# Qwen3.6-27B Full SFT 配置（MindSpeed-MM FSDP2，基于官方 qwen3_6_27B_config.yaml 改）
# 改动点：template=qwen3_6、formatting=openai、数据=20260702_openai.jsonl、
#         删 model.visual freeze/recompute（纯文本无 visual）、权重路径、短跑验证参数

# 并行策略
parallel:
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.language_model
      - model.language_model.embed_tokens
      - model.language_model.layers.{*}
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  ulysses_parallel_size: 1

### 数据相关配置
data:
  dataset_param:
    dataset_type: huggingface
    attr:
      images: null                 # 纯文本，无图片
      messages: messages
      tools: tools                 # 单步推理无 tools，OpenAI 转换器 absent 时返回 None
      role_tag: role
      content_tag: content
      user_tag: user
      assistant_tag: assistant
      system_tag: system
      observation_tag: tool
      formatting: openai           # 关键：OpenAI 转换器（master 分支才有）

    preprocess_parameters:
      model_name_or_path: &HF_MODEL_LOAD_PATH /models/Qwen3.6-27B
      use_fast_tokenizer: true
      split_special_tokens: false

    basic_parameters:
      cutoff_len: 4096
      template: qwen3_6            # 带 thinking 渲染（数据有 reasoning_content）
      enable_thinking: true        # 渲染 reasoning_content 为  blockDim 块
      train_on_prompt: false
      mask_history: false
      dataset_dir: /workspace/llin-rl-dpo/datasets/rjx
      dataset: /workspace/llin-rl-dpo/datasets/rjx/20260702_openai_rows0_31.jsonl
      cache_dir: /workspace/llin-rl-dpo/cache/rjx_cutoff_test_native_rows0_31_2step
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null

  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true
    enable_preload: false

# 模型配置
model:
  model_id: qwen3_5              # Qwen3.6 底层沿用 Qwen3.5 架构，model plugin 共用
  model_name_or_path: *HF_MODEL_LOAD_PATH
  trust_remote_code: true
  attn_implementation: flash_attention_2
  freeze: []                     # 纯文本无 visual，Full SFT 不冻结
  gdn_implementation: triton
  causal_conv1d_implementation: eager

# 优化特性配置
features:
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  recompute: true
  recompute_plan:
    apply_modules:
      - model.language_model.layers.{*}   # 删 model.visual.blocks
  enable_chunk_loss: true
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 256
  enable_activation_offload: true
  activation_offload_plan:
    apply_modules:
      - model.language_model.layers.{*}   # 删 model.visual.blocks

# 训练配置
training:
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 2  # smoke test rotary patch
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 1000            # 每 100 iter 存一次
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: /workspace/llin-rl-dpo/checkpoints/msmm-qwen36-27b-dcp    # dcp 权重（release 上一级）
  save: /workspace/llin-rl-dpo/outputs/rjx-cutoff-test-native-rows0-31-2step
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

# 工具配置
tools:
  profile:
    enable: false
    profile_type: static
    ranks: [0]
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
    enable: false
    start_step: 1
    end_step: 2
    save_path: ./memory_snapshot
    dump_ranks: [0]
    stacks: all
    max_entries: null
    mem_info: false
